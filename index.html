
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17172b">
  <title>AyoXtiana World | Shop Online</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7fb;
      color: #202033;
    }

    header {
      background: #17172b;
      color: white;
      text-align: center;
      padding: 28px 16px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    header p {
      color: #d8d8ee;
      margin: 0;
    }

    .search {
      padding: 16px;
      background: white;
    }

    .search input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    h2 {
      padding: 0 14px;
      font-size: 21px;
    }

    .categories {
      display: flex;
      gap: 8px;
      padding: 0 12px 16px;
      overflow-x: auto;
    }

    .categories button {
      width: auto;
      flex-shrink: 0;
      padding: 10px 14px;
      border-radius: 20px;
      background: #e9e8f8;
      color: #393582;
    }

    .categories button.active {
      background: #4541a5;
      color: white;
    }

    .cart {
      background: white;
      margin: 0 12px 20px;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0000000b;
    }

    .cart h3 {
      margin-top: 0;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 10px 0;
      font-size: 14px;
    }

    .cart-total {
      font-size: 19px;
      font-weight: bold;
      color: #4541a5;
    }

    .clear-button {
      background: #e9e8f8;
      color: #393582;
      margin-top: 8px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 0 12px 28px;
    }

    .product {
      min-width: 0;
      background: white;
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0000000b;
    }

    .picture {
      min-height: 115px;
      display: grid;
      place-items: center;
      background: #ededfa;
      border-radius: 10px;
      font-size: 46px;
    }

    .product h3 {
      font-size: 15px;
      margin: 12px 0 6px;
    }

    .category-label {
      color: #777;
      font-size: 12px;
      margin: 0 0 8px;
    }

    .price {
      font-weight: bold;
      color: #4541a5;
      margin: 8px 0 12px;
    }

    button {
      width: 100%;
      padding: 11px 8px;
      border: none;
      border-radius: 8px;
      background: #4541a5;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    .empty {
      padding: 12px;
      color: #666;
      grid-column: 1 / -1;
    }

    footer {
      text-align: center;
      background: #17172b;
      color: white;
      padding: 24px 16px;
    }

    footer p {
      margin: 6px;
    }

    @media (min-width: 700px) {
      .products {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        padding-left: 20px;
        padding-right: 20px;
      }

      .cart {
        margin-left: 20px;
        margin-right: 20px;
      }

      .categories {
        padding-left: 20px;
      }

      h2 {
        padding-left: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>AyoXtiana World</h1>
    <p>Your style. Your world. Your store.</p>
  </header>

  <div class="search">
    <input
      type="search"
      id="search"
      placeholder="Search fashion, shoes and accessories..."
      aria-label="Search products"
    >
  </div>

  <h2>Shop our collection 🛍️</h2>

  <div class="categories" id="categories">
    <button class="active" data-category="All">All</button>
    <button data-category="Clothing">Clothing</button>
    <button data-category="Shoes">Shoes</button>
    <button data-category="Bags">Bags</button>
    <button data-category="Accessories">Accessories</button>
  </div>

  <section class="cart">
    <h3>🛒 Your Shopping Cart</h3>
    <div id="cartItems">Your cart is empty.</div>

    <div class="cart-row">
      <span>Items:</span>
      <strong id="cartCount">0</strong>
    </div>

    <div class="cart-row">
      <span>Total:</span>
      <span class="cart-total" id="cartTotal">₦0</span>
    </div>

    <button class="clear-button" id="clearCart">
      Clear Cart
    </button>
    <button id="orderWhatsApp" style="margin-top:10px;">
  Order via WhatsApp
</button>
  </section>

  <div class="products" id="products"></div>

  <footer>
    <p><strong>AyoXtiana World</strong></p>
    <p>Fashion • Shoes • Accessories</p>
    <p>Find your style. Express yourself.</p>
    <p>© <span id="year"></span> AyoXtiana World</p>
  </footer>

  <script>
    const items = [
      {
        id: 1,
        name: "Classic Sneakers",
        price: 18000,
        emoji: "👟",
        category: "Shoes"
      },
      {
        id: 2,
        name: "Stylish Handbag",
        price: 12000,
        emoji: "👜",
        category: "Bags"
      },
      {
        id: 3,
        name: "Fashion Watch",
        price: 9500,
        emoji: "⌚",
        category: "Accessories"
      },
      {
        id: 4,
        name: "Modern Sunglasses",
        price: 5000,
        emoji: "🕶️",
        category: "Accessories"
      },
      {
        id: 5,
        name: "Casual Outfit",
        price: 15000,
        emoji: "👕",
        category: "Clothing"
      },
      {
        id: 6,
        name: "Elegant Shoes",
        price: 22000,
        emoji: "👠",
        category: "Shoes"
      }
    ];

    const products = document.getElementById("products");
    const search = document.getElementById("search");

    let selectedCategory = "All";
    let cart = [];

    function formatNaira(amount) {
      return "₦" + amount.toLocaleString("en-NG");
    }

    function showProducts() {
      products.innerHTML = "";

      const searchText = search.value.trim().toLowerCase();

      const filtered = items.filter(item => {
        const matchesSearch =
          item.name.toLowerCase().includes(searchText);

        const matchesCategory =
          selectedCategory === "All" ||
          item.category === selectedCategory;

        return matchesSearch && matchesCategory;
      });

      if (filtered.length === 0) {
        products.innerHTML =
          '<p class="empty">No matching products found.</p>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement("article");
        card.className = "product";

        const picture = document.createElement("div");
        picture.className = "picture";
        picture.textContent = item.emoji;

        const name = document.createElement("h3");
        name.textContent = item.name;

        const category = document.createElement("p");
        category.className = "category-label";
        category.textContent = item.category;

        const price = document.createElement("p");
        price.className = "price";
        price.textContent = formatNaira(item.price);

        const button = document.createElement("button");
        button.textContent = "Add to Cart";
        button.addEventListener("click", () => {
          addToCart(item.id);
        });

        card.append(picture, name, category, price, button);
        products.appendChild(card);
      });
    }

    function addToCart(productId) {
      const item = items.find(product => product.id === productId);

      if (!item) return;

      const existing = cart.find(entry => entry.id === productId);

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          ...item,
          quantity: 1
        });
      }

      updateCart();
    }

    function updateCart() {
      const cartItems = document.getElementById("cartItems");
      const cartCount = document.getElementById("cartCount");
      const cartTotal = document.getElementById("cartTotal");

      cartItems.innerHTML = "";

      if (cart.length === 0) {
        cartItems.textContent = "Your cart is empty.";
      }

      cart.forEach(item => {
        const row = document.createElement("div");
        row.className = "cart-row";

        const description = document.createElement("span");
        description.textContent =
          item.emoji + " " + item.name + " × " + item.quantity;

        const subtotal = document.createElement("strong");
        subtotal.textContent =
          formatNaira(item.price * item.quantity);

        const remove = document.createElement("button");
        remove.textContent = "−";
        remove.setAttribute(
          "aria-label",
          "Remove one " + item.name
        );
        remove.style.width = "36px";
        remove.style.padding = "6px";

        remove.addEventListener("click", () => {
          removeFromCart(item.id);
        });

        row.append(description, subtotal, remove);
        cartItems.appendChild(row);
      });

      const count = cart.reduce(
        (sum, item) => sum + item.quantity,
        0
      );

      const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
      );

      cartCount.textContent = count;
      cartTotal.textContent = formatNaira(total);
    }

    function removeFromCart(productId) {
      const item = cart.find(entry => entry.id === productId);

      if (!item) return;

      item.quantity -= 1;

      if (item.quantity <= 0) {
        cart = cart.filter(entry => entry.id !== productId);
      }

      updateCart();
    }

    document.getElementById("categories")
      .addEventListener("click", event => {
        const button = event.target.closest("button[data-category]");

        if (!button) return;

        selectedCategory = button.dataset.category;

        document.querySelectorAll(
          "#categories button"
        ).forEach(categoryButton => {
          categoryButton.classList.toggle(
            "active",
            categoryButton === button
          );
        });

        showProducts();
      });

    search.addEventListener("input", showProducts);

    document.getElementById("clearCart")
      .addEventListener("click", () => {
        cart = [];
        updateCart();
      });

    document.getElementById("year").textContent =
      new Date().getFullYear();

    function orderViaWhatsApp() {
  if (cart.length === 0) {
    alert("Your cart is empty. Please add a product first.");
    return;
  }

  const phoneNumber = "2348169134018";

  let message = "Hello AyoXtiana World! I want to place an order:\n\n";

  cart.forEach(item => {
    message += item.name + " x " + item.quantity +
      " - " + formatNaira(item.price * item.quantity) + "\n";
  });

  const total = cart.reduce(
    (sum, item) => sum + item.price * item.quantity,
    0
  );

  message += "\nTotal: " + formatNaira(total);
  message += "\n\nPlease confirm availability, delivery fee and payment options.";

  const url = "https://wa.me/" + phoneNumber +
    "?text=" + encodeURIComponent(message);

  window.open(url, "_blank");
}

document.getElementById("orderWhatsApp")
  .addEventListener("click", orderViaWhatsApp);
    
    showProducts();
    updateCart();
  </script>

</body>
</html>
